name: CI

# ENG-1: this repository had zero CI prior to this workflow — only
# Laravel's two example tests existed and .github/workflows was empty.
# This is the CI half of §5 of docs/SYSTEM_REVIEW_AND_MIGRATION_PLAN.md;
# deploy.yml (the CD half) only runs once this workflow has succeeded.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so a fast-follow push
# doesn't leave stale runs queued behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run type-check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            public/js
            public/css
            public/mix-manifest.json
          retention-days: 7

  backend-tests:
    needs: [frontend]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lawfirm_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      # Needed so ExampleTest's GET / (and anything else that renders a
      # Blade view referencing mix()) can find public/mix-manifest.json —
      # this job doesn't build assets itself, it reuses frontend's build.
      - name: Download built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public

      - run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lawfirm_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      # ENG-1: coverage gate — nothing merges below 80% line coverage on
      # app/. See §3.1 of the migration plan for what these tests cover
      # (auth, the SEC-3 permission matrix, validation, domain rules,
      # data-integrity FK constraints).
      - name: Unit & feature tests (coverage gate 80%)
        run: php artisan test --coverage --min=80
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lawfirm_test
          DB_USERNAME: root
          DB_PASSWORD: secret

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test

  e2e:
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lawfirm_e2e
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: composer install --prefer-dist --no-progress
      - run: npm ci

      - run: cp .env.example .env && php artisan key:generate
      - name: Build frontend assets
        run: npm run build

      - name: Seed application (E2ETestSeeder — see database/seeders)
        run: php artisan migrate --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lawfirm_e2e
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Install Playwright browsers
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ENG-3: QUEUE_CONNECTION is 'database' (not 'sync'), so jobs like
      # hearing reminders / welcome SMS need an actual worker running for
      # the E2E journeys that depend on them (see §3.2 journey #3).
      - name: Start queue worker
        run: php artisan queue:work --daemon --tries=1 &
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lawfirm_e2e
          DB_USERNAME: root
          DB_PASSWORD: secret

      # --no-reload is load-bearing: without it, `artisan serve` strips the
      # DB_* env vars below from the child server process whenever a .env
      # file exists (its .env hot-reload mechanism), and the served app
      # silently falls back to .env.example's credentials/database instead.
      - name: Serve the application
        run: php artisan serve --host=127.0.0.1 --port=8000 --no-reload &
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lawfirm_e2e
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Wait for the app to respond
        run: npx wait-on http://127.0.0.1:8000 --timeout 60000

      # §3.2: critical user journeys — login→dashboard, client→case→
      # document, hearing→reminder, invoice workflow, case expenses,
      # RBAC (SEC-3 regression), delete-audit (DATA-7/UI-8 regression),
      # pagination/sort/filter (UI-5 regression).
      - name: Functional tests
        working-directory: tests-e2e
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests-e2e/playwright-report

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: composer install --prefer-dist --no-progress
      - name: PHP dependency CVE audit
        run: composer audit

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: JS dependency CVE audit
        run: npm audit --audit-level=high

      # ENG-1/SEC-1: prevents a repeat of the hardcoded SMS credentials
      # (app/Helper.php) and the committed /password file ever merging
      # again — this job is required on branch protection.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
